<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXAMPLE WEBSITE · BEST</title>
<style>
  /* ---------- 基础样式 ---------- */
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, sans-serif;
    line-height: 1.65;
    color: #1a1a1a;
    background: #ffffff;
  }

  h1, h2, h3, p { margin: 0; }
  a { color: inherit; text-decoration: none; }

  .container {
    width: min(1080px, 100% - 40px);
    margin-inline: auto;
  }

  /* ---------- 导航 ---------- */
  .nav {
    border-bottom: 1px solid #e5e5e5;
    padding: 16px 0;
  }
  .nav__inner {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
  }
  .nav__links {
    display: flex;
    gap: 24px;
    margin-left: auto;
    font-size: 15px;
    color: #555;
  }
  .nav__links a:hover { color: #000; }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    background: #1a1a1a;
    color: #fff;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .8; }

  /* ---------- 首屏 ---------- */
  .hero {
    padding: 100px 0 80px;
    text-align: center;
  }
  .hero h1 {
    font-size: clamp(30px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .hero p {
    max-width: 560px;
    margin: 18px auto 0;
    font-size: 17px;
    color: #666;
  }
  .hero .btn { margin-top: 30px; }

  /* ---------- 内容区块 ---------- */
  .section {
    padding: 80px 0;
    background: #fafafa;
  }
  .section h2 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 48px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 28px;
  }
  .card h3 {
    font-size: 17px;
    margin-bottom: 8px;
  }
  .card p {
    font-size: 14.5px;
    color: #666;
  }

  /* ---------- 页脚 ---------- */
  .footer {
    border-top: 1px solid #e5e5e5;
    padding: 40px 0;
    text-align: center;
    font-size: 14px;
    color: #888;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .nav__links { display: none; }
    .hero { padding: 64px 0 48px; }
  }
</style>
</head>
<body>

  <!-- 导航 -->
  <header class="nav">
    <div class="container nav__inner">
      <a class="logo" href="#">EXAMPLE WEBSITE</a>
      <nav class="nav__links">
        <a href="#">THE FIRST</a>
        <a href="#">THE SECOND</a>
        <a href="#">THE THIRD</a>
      </nav>
      <a class="btn" href="#">LET'S GO!</a>
    </div>
  </header>

  <!-- 首屏 -->
  <section class="hero">
    <div class="container">
      <h1>ONE</h1>
      <p>THIS IS EXAMPLE WEBSITE.</p>
      <a class="btn" href="#">BOTTOM</a>
    </div>
  </section>

  <!-- 内容区 -->
  <section class="section">
    <div class="container">
      <h2>TWO</h2>
      <div class="grid">
        <div class="card">
          <h3>TWO</h3>
          <p>DESCRIBE: TEXT1</p>
        </div>
        <div class="card">
          <h3>THREE</h3>
          <p>DESCRIBE: TEXT2</p>
        </div>
        <div class="card">
          <h3>FOUR</h3>
          <p>DESCRIBE: TEXT3</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 EXAMPLE WEBSITE · BEST</p>
    </div>
  </footer>

</body>
</html>
